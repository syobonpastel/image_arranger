<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Arranger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Arranger</h1>
    <p class="sub">画像を貼り付け（⌘V / Ctrl+V）・ドロップ・選択して、SNS用サイズに整形。複数枚はタブで切り替え</p>
  </header>

  <main>
    <section class="stage-wrap">
      <div class="tabs" id="tabs" role="tablist">
        <label class="tab-add" title="画像を追加">＋<input id="fileInputTab" type="file" accept="image/*" multiple hidden></label>
      </div>

      <div id="stage" class="stage empty">
        <canvas id="canvas"></canvas>
        <div id="brushCursor" class="brush-cursor" hidden></div>
        <div id="dropHint" class="drop-hint">
          <p>ここに画像をドロップ（複数可）<br>または ⌘V / Ctrl+V で貼り付け</p>
          <div class="row">
            <label class="btn primary">画像を選択<input id="fileInput" type="file" accept="image/*" multiple hidden></label>
            <button id="pasteBtn" class="btn">クリップボードから貼り付け</button>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div class="seg" id="modeSeg">
          <button data-mode="move" class="active">✋ 移動</button>
          <button data-mode="blur">🖌 ぼかしペン</button>
          <button data-mode="erase">🧽 ぼかし消し</button>
        </div>
        <button id="undoBtn" class="btn">↶ 元に戻す</button>
        <button id="clearBlurBtn" class="btn">ぼかし全消去</button>
      </div>
    </section>

    <aside class="panel">
      <details open>
        <summary>サイズ・配置</summary>
        <label>編集中のサイズ
          <select id="preset"></select>
        </label>
        <label>背景色
          <input id="bg" type="color" value="#ffffff">
        </label>
        <label>画像の大きさ <output id="scaleOut">100%</output>
          <input id="scale" type="range" min="20" max="300" value="100">
        </label>
        <div class="row">
          <span class="lbl">画像の位置</span>
          <button class="btn sm" data-align="top">上</button>
          <button class="btn sm" data-align="bottom">下</button>
          <button class="btn sm" data-align="left">左</button>
          <button class="btn sm" data-align="right">右</button>
          <button class="btn sm" data-align="center">中央</button>
        </div>
        <p class="hint">位置・大きさはサイズごとに別々に記憶されます。「移動」モードで画像をドラッグしても動かせます。</p>
      </details>

      <details open>
        <summary>文字</summary>
        <label>文字1（上 / 左の余白）
          <textarea id="textTop" rows="2" placeholder="例: 2026.09.23 プラネタリウム"></textarea>
        </label>
        <label>文字2（下 / 右の余白）
          <textarea id="textBottom" rows="2" placeholder="例: #天文部"></textarea>
        </label>
        <div class="grid2">
          <label>文字の位置
            <select id="textPlace">
              <option value="auto">自動（余白の広い側）</option>
              <option value="tb">上下</option>
              <option value="lr">左右</option>
            </select>
          </label>
          <label>左右のときの書き方
            <select id="sideWriting">
              <option value="vertical">縦書き</option>
              <option value="horizontal">横書き</option>
            </select>
          </label>
        </div>
        <label>フォント
          <select id="font">
            <option value="Noto Sans JP">Noto Sans JP（ゴシック）</option>
            <option value="Noto Serif JP">Noto Serif JP（明朝）</option>
            <option value="M PLUS Rounded 1c">M PLUS Rounded 1c（丸ゴ）</option>
            <option value="Zen Maru Gothic">Zen Maru Gothic（丸ゴ）</option>
            <option value="Dela Gothic One">Dela Gothic One（極太）</option>
          </select>
        </label>
        <div class="grid2">
          <label>文字サイズ <output id="sizeOut">56</output>
            <input id="size" type="range" min="16" max="200" value="56">
          </label>
          <label>文字色
            <input id="color" type="color" value="#222222">
          </label>
        </div>
        <div class="grid2">
          <label>太さ
            <select id="weight">
              <option value="400">標準</option>
              <option value="700" selected>太字</option>
              <option value="900">極太</option>
            </select>
          </label>
          <label>揃え
            <select id="align">
              <option value="center">中央</option>
              <option value="left">左（縦書きは上）</option>
              <option value="right">右（縦書きは下）</option>
            </select>
          </label>
        </div>
        <p class="hint">文字の設定は全タブ共通で、Cookieに自動保存されます。</p>
      </details>

      <details open>
        <summary>ぼかしペン</summary>
        <label>ペンの太さ <output id="brushOut">60</output>
          <input id="brush" type="range" min="10" max="300" value="60">
        </label>
        <label>ぼかしの強さ <output id="strengthOut">20</output>
          <input id="strength" type="range" min="2" max="60" value="20">
        </label>
        <label>種類
          <select id="blurType">
            <option value="blur">ぼかし</option>
            <option value="mosaic">モザイク</option>
          </select>
        </label>
      </details>

      <details open>
        <summary>書き出し</summary>
        <span class="lbl">書き出すサイズ（複数選択可）</span>
        <div id="exportSizes" class="checks"></div>
        <label>形式
          <select id="format">
            <option value="image/jpeg">JPEG（高画質）</option>
            <option value="image/png">PNG</option>
          </select>
        </label>
        <div class="row">
          <button id="downloadBtn" class="btn primary" disabled>⬇ このタブを書き出し</button>
          <button id="downloadAllBtn" class="btn" disabled>⬇ 全タブを書き出し</button>
        </div>
        <div class="row">
          <button id="copyBtn" class="btn" disabled>表示中の画像をコピー</button>
          <button id="shareBtn" class="btn" disabled hidden>共有…</button>
        </div>
        <p class="hint">複数枚は1枚ずつ連続でダウンロードします。初回はブラウザに「複数ファイルのダウンロードを許可」するよう聞かれることがあります。</p>
      </details>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
